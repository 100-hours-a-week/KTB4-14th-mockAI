name: AI PR CI

on:
  pull_request:
    branches: [develop]

# 같은 PR에 연속 push 시 이전 CI 취소
concurrency:
  group: ai-ci-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    # ARM64 이미지를 직접 빌드하므로 QEMU 에뮬레이션이 불필요
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false # checkout 이후 Git 명령용 인증 정보를 유지하지 않음

      - name: uv / Python 세팅
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12" # Dockerfile 베이스 이미지와 동일
          enable-cache: true # uv가 다운로드한 패키지 캐싱 (uv.lock 내용이 캐시 키)

      # .venv는 생성 시점의 Python 인터프리터 경로를 참조하므로, 러너의 Python 버전이 바뀌면 복원한 venv가 동작하지 않을 수 있어 캐싱하지 않는다.
      - name: 의존성 설치
        run: uv sync --frozen --extra dev

      - name: 테스트 실행
        id: test
        run: uv run --frozen pytest --junitxml=test-report.xml -rA --tb=short

      # 테스트가 실패해도 결과와 실패 로그를 실행 요약(Job Summary)에 게시
      - name: 테스트 결과 요약 게시
        if: always()
        uses: test-summary/action@v2
        with:
          paths: test-report.xml
          # 성공·실패·건너뜀은 개수로만 표시하고, 표에는 실패한 테스트만 출력
          show: fail

      # 이후 단계는 테스트가 통과해야만 실행 (앞 단계 실패 시 자동 skip)
      - name: 도커 빌드 환경 세팅
        uses: docker/setup-buildx-action@v4

      - name: 도커 이미지 빌드 테스트 실행
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false # 빌드 '테스트'만 진행
          tags: audigo-ai:ci-test
          # 러너(GitHub Actions) 캐시에 레이어를 저장/재사용해 PR마다 반복 빌드 시간을 단축
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job Summary 게시 (단계별 결과)
        # 중간 단계가 실패해도 어디서 멈췄는지를 요약에 게시
        if: always()
        env:
          TEST: ${{ steps.test.outcome }}
          BUILD: ${{ steps.build.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ 성공" ;;
              failure) echo "❌ 실패" ;;
              skipped|"") echo "⏭️ 건너뜀" ;;
              *) echo "⚠️ $1" ;;
            esac
          }

          {
            echo "## AI PR CI 결과"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| PR | #${PR_NUMBER} (\`${GITHUB_HEAD_REF}\` → \`${GITHUB_BASE_REF}\`) |"
            echo "| Commit SHA | \`${HEAD_SHA}\` |"
            echo
            echo "### 단계별 결과"
            echo
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| 테스트 (pytest) | $(icon "$TEST") |"
            echo "| ARM64 이미지 빌드 테스트 | $(icon "$BUILD") |"
            echo
            echo "테스트 상세 결과는 위 테스트 요약을 확인하세요."
          } >> "$GITHUB_STEP_SUMMARY"
