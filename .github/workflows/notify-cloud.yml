name: AI 이미지 발행 결과를 Cloud에 알림

# 이미지 발행이 끝난 뒤 알림 전용 workflow를 실행합니다.
# workflow_run 수신에는 이 파일이 저장소 기본 브랜치에 존재해야 한다는 전제가 있습니다.
on:
  workflow_run:
    # 표시 이름 변경 전후의 발행 실행과 실행 이력을 모두 수신합니다.
    workflows: [AI Image CD, AI 이미지 발행]
    types: [completed]

# 기본 GITHUB_TOKEN 권한 없이, Cloud dispatch 전용 자격증명만 사용합니다.
permissions: {}

jobs:
  notify:
    # 성공한 동일 AI 저장소의 main Push 발행만 허용합니다. PR·실패·취소 실행은 전달하지 않습니다.
    if: >-
      (github.event.workflow_run.name == 'AI Image CD' || github.event.workflow_run.name == 'AI 이미지 발행') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == '100-hours-a-week/KTB4-14th-mockAI'
    runs-on: ubuntu-24.04
    steps:
      # 소스 checkout이나 artifact 실행 없이 run ID·attempt만 전달합니다.
      # Cloud가 이 식별자로 원본 run·artifact·registry를 독립적으로 다시 검증합니다.
      # 수신 workflow가 Cloud main에 먼저 있어야 하므로 Cloud PR을 선병합합니다.
      - name: Cloud 스테이징 갱신 요청
        id: dispatch
        env:
          # 다른 저장소의 Actions 실행을 요청하는 전용 토큰입니다. 기본 GITHUB_TOKEN과 별개입니다.
          GH_TOKEN: ${{ secrets.CLOUD_WORKFLOW_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ && "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          gh api --method POST repos/100-hours-a-week/KTB4-14th-Cloud/actions/workflows/ai-staging.yml/dispatches \
            -f ref=main -f "inputs[run_id]=$RUN_ID" -f "inputs[run_attempt]=$RUN_ATTEMPT" > /dev/null

      # dispatch 수락 여부만 남깁니다. Cloud 처리·Git 반영·Pod Sync 완료와는 별도 결과입니다.
      - name: 알림 결과 기록
        if: always()
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
        run: |
          {
            echo '### Cloud 스테이징 알림'
            echo "- 발행 소스 SHA: \`${SOURCE_SHA}\`"
            echo "- 발행 실행: \`${RUN_ID}\`, attempt: \`${RUN_ATTEMPT}\`"
            echo "- 요청 결과: \`${DISPATCH_OUTCOME}\`"
            echo '이 결과는 요청 수락만 의미하며, Cloud 처리와 스테이징 Sync 완료는 별도입니다.'
          } >> "$GITHUB_STEP_SUMMARY"
