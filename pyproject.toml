[project]
name = "audigo-mock-ai-api"
version = "0.2.2"
description = "Audigo itinerary AI API with mock data routes"
requires-python = ">=3.11,<3.15"
dependencies = [
  "boto3==1.43.100",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "pydantic==2.11.9",
  "python-dotenv==1.1.1",
  "uvicorn[standard]==0.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
